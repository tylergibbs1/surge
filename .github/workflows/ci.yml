name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-quality:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Match mypy's configured target so dependency stubs cannot use
          # syntax that the oldest supported interpreter cannot import.
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check src tests modal_app/app.py \
            experiments/conformal.py experiments/eval_c2.py \
            experiments/features.py experiments/finetune_c2.py \
            experiments/overfit.py experiments/run_c2.py \
            experiments/run_conformal_c2.py experiments/select_c2_candidate.py \
            scripts/rebuild_data_snapshot.py scripts/audit_ledger.py \
            scripts/score_ledger.py scripts/verify_forecasts.py \
            scripts/check_runtime_stack.py
      - run: mypy src modal_app/app.py

  python-tests:
    name: Python ${{ matrix.python }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest

  runtime-stack:
    name: Pinned runtime import smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Modal serves this stack on Python 3.12.
          python-version: "3.12"
          cache: pip
      - name: Install the known-good runtime stack
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.8.0"
          python -m pip install -e ".[api,train]"
      - run: python -m pip check
      - run: python scripts/check_runtime_stack.py

  package:
    name: Package artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Install and smoke-test the wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c 'import surge; from importlib.metadata import version; assert surge.__version__ == version("surge-grid")'
          surge-grid --help

  frontend:
    name: Frontend quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web/playground
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/playground/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
