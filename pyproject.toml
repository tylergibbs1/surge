[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "surge-grid"
dynamic = ["version"]
description = "Open, auditable forecasts and data tools for the US power grid"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tyler Gibbs and Surge contributors" }]
keywords = ["grid", "energy", "forecasting", "electricity", "iso", "eia"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "holidays>=0.55",
    "httpx>=0.27",
    "numpy>=1.26",
    "polars>=1.0",
    "pyarrow>=16.0",
    "pydantic>=2.6",
    "rich>=13.7",
    "tenacity>=9.0",
    "platformdirs>=4.0",
    "tqdm>=4.66",
    "typer>=0.12",
    "zstandard>=0.22",
]

[project.optional-dependencies]
dev = [
    "fastapi>=0.115",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-vcr>=1.0",
    "ruff>=0.6",
    "slowapi>=0.1.9",
    "mypy>=1.10",
]
weather = ["herbie-data>=2024.3", "cdsapi>=0.7"]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "slowapi>=0.1.9",
    # Known-good H100 inference stack. Keep this synchronized with the train
    # extra, the Modal image, and scripts/check_runtime_stack.py.
    "chronos-forecasting==2.3.1",
    "holidays==0.101",
    "numpy==2.1.2",
    "peft==0.20.0",
    "polars==1.43.2",
    "pyarrow==25.0.0",
    "torch==2.8.0",
    "transformers==4.57.6",
]
train = [
    "chronos-forecasting==2.3.1",
    "holidays==0.101",
    "numpy==2.1.2",
    "peft==0.20.0",
    "polars==1.43.2",
    "pyarrow==25.0.0",
    "torch==2.8.0",
    "transformers==4.57.6",
]
all = ["surge-grid[dev,weather,api,train]"]

[project.scripts]
surge-grid = "surge.cli:app"

[project.urls]
Homepage = "https://surgeforecast.com"
Repository = "https://github.com/tylergibbs1/surge"
Documentation = "https://github.com/tylergibbs1/surge/tree/main/docs"
Issues = "https://github.com/tylergibbs1/surge/issues"
Changelog = "https://github.com/tylergibbs1/surge/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/surge/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/surge"]

[tool.hatch.build.targets.sdist]
exclude = ["/web/playground/tsconfig.tsbuildinfo"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"

[tool.mypy]
# Not `strict = true` on purpose: scrapers/ and the inference path rely on
# third-party libs without stubs (chronos, holidays, polars expr chains)
# where strict mode would drown real signal in "missing annotation" noise.
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
no_implicit_optional = true

# Per-module opt-outs for files that lean heavily on dynamic third-party
# APIs. New code (bas.py, api/schemas.py, tests/) still gets type-checked.
[[tool.mypy.overrides]]
module = [
    "surge.scrapers.*",
    "surge.api.main",
    "surge.api.forecaster",
    "surge.store",
    "surge.cache",
]
ignore_errors = true
